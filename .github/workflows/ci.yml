# Builds and tests the MCP servers against the current VGraph engine, checked out
# as on the maintainer's machine: this repository inside VGraph's, in a folder
# named VGraph, because Package.swift builds against `..`. It only checks:
# releases stay on that machine (VGraph ADR 0036). Public repository: never
# pull_request_target. Actions are pinned to a full commit SHA, as in VGraph.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Swift servers on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vithanco/VGraph
          path: VGraph
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: VGraph/vgraph-mcp
          persist-credentials: false
      # The container comes from VGraph's .swift-version, so a Swift bump there needs no change here.
      - name: Build and test
        run: |
          docker run --rm -v "$PWD/VGraph:/work/VGraph" -w /work/VGraph/vgraph-mcp \
            "swift:$(tr -d '[:space:]' < VGraph/.swift-version)-noble" ./scripts/ci-swift.sh

  node:
    name: npm host against the VGraph engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vithanco/VGraph
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vgraph-mcp
          persist-credentials: false
      # A test can pass while calling an export the engine no longer has.
      - name: Every engine call still exists
        run: ./scripts/check-plugin-api.sh
      - name: Identify the engine
        id: engine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore the engine
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/Package
          key: engine-${{ steps.engine.outputs.sha }}
      - name: Build the engine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work "swift:$(tr -d '[:space:]' < .swift-version)-noble" ./scripts/ci-engine.sh
          sudo chown -R "$(id -u):$(id -g)" .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vendor the engine and test the host
        working-directory: vgraph-mcp
        run: |
          mkdir -p vendor
          cp -R ../website/Package vendor/Package
          cp -R ../fonts vendor/fonts
          npm ci
          npm test

  scripts:
    # The shell tests are written for the maintainer's macOS: bash 3.2 and BSD tools.
    name: Shell tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install just
      - name: Shell tests
        run: |
          failed=0
          for t in check-generated mcp-registry cloud-image justfile-hygiene; do
            echo "::group::$t"
            ./scripts/$t.test.sh || failed=1
            echo "::endgroup::"
          done
          exit $failed
